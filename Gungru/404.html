        .error-more a:hover { color: #D4782A; background: rgba(212,120,42,0.06); }

        .error-divider::before, .error-divider::after {
            content: ''; height: 1px; width: 40px;
            background: linear-gradient(90deg, transparent, #D4782A, transparent);
